
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Aventurero - Spring Boot</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            text-align: center;
            margin-top: 80px;
        }

        h1 {
            color: #f0c040;
            font-size: 2.5em;
        }

        h2 {
            color: #4a90d9;
        }

        p {
            font-size: 1.2em;
        }

        .caja {
            display: inline-block;
            border: 2px solid #4a90d9;
            border-radius: 12px;
            padding: 30px 60px;
            margin-top: 20px;
        }

        a {
            color: #f0c040;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="caja">

        <h1>
            Aventurero:
            <span th:text="${aventurero.nombre}">
                Nombre
            </span>
        </h1>

        <h2>
            Clase:
            <span th:text="${aventurero.clase}">
                Clase
            </span>
        </h2>

        <p>
            Nivel:
            <strong th:text="${aventurero.nivel}">
                0
            </strong>
        </p>

        <a th:href="@{/saludo}">
            Volver al saludo
        </a>

    </div>

</body>
</html>
